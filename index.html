<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191719" id="tcolor">
<title>Sermons</title>
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;
 src:url(fonts/inter-400-latin.woff2) format('woff2');
 unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;
 src:url(fonts/inter-400-latin-ext.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;
 src:url(fonts/inter-500-latin.woff2) format('woff2');
 unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;
 src:url(fonts/inter-500-latin-ext.woff2) format('woff2')}
:root{
 --bg:#f6f0e9; --text:#302621; --muted:#756052; --line:#d6c7bd;
 --field:#fffaf5; --accent:#9b4727; --accq:rgba(155,71,39,.13);
 --navh:58px;
}
:root[data-theme="dark"]{
 --bg:#191719; --text:#f6f0eb; --muted:#bcb1aa; --line:#413735;
 --field:#262123; --accent:#efa479; --accq:rgba(239,164,121,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 font-size:16px;line-height:1.5;overflow-x:clip;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.wrap{max-width:736px;margin:0 auto;padding:0 18px}

.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);
 backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line);
 padding:9px 18px;padding-top:calc(9px + env(safe-area-inset-top,0px))}
.topin{max-width:736px;margin:0 auto;display:flex;align-items:center;gap:11px;min-height:40px}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;
 background:#e5a17c;color:#34231c;flex:0 0 auto}
.mark svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;
 stroke-linecap:round;stroke-linejoin:round}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;font-weight:500;letter-spacing:-.3px}
.brand span{display:block;font-size:11px;color:var(--muted)}
.back{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--accent);
 margin-left:-4px;flex:1}
.back[hidden]{display:none}
.back svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;
 stroke-linecap:round;stroke-linejoin:round}
.tt{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.tt svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.9;stroke-linecap:round}
</style>
</head><body>
<div class="top"><div class="topin">
  <span class="mark" id="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="4.5" height="6" rx="2"/><rect x="17" y="14" width="4.5" height="6" rx="2"/></svg></span>
  <button class="back" id="back" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span id="backlab">All books</span></button>
  <div class="brand" id="brand"><b>Sermons</b><span id="sub"></span></div>
  <button class="tt" id="tt" aria-label="Theme"><svg id="ttsvg" viewBox="0 0 24 24"></svg></button>
</div></div>
<div class="wrap" id="app"></div>
<script src="data/index.js"></script>
<script>
const CSS = `
.search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);
 background:var(--field);border-radius:10px;padding:0 12px;margin:16px 0 4px}
.search svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;flex:0 0 auto}
.search input{min-width:0;width:100%;background:transparent;color:var(--text);
 border:0;padding:13px 0;font:inherit;font-size:16px;outline:none}
.search input::placeholder{color:var(--muted);opacity:1;font-size:13px}

.shelf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}
.shelf h3{margin:0;color:var(--muted);font:500 11px/1.4 Inter,sans-serif;
 text-transform:uppercase;letter-spacing:1.1px}
.shelf small{font-size:11px;color:var(--muted)}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:540px){.bgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:700px){.bgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{height:76px;min-width:0;border:1px solid #675047;border-radius:10px;
 padding:13px 11px 11px 14px;position:relative;display:flex;flex-direction:column;
 justify-content:space-between;background:#302726;color:#f6eee8;
 transition:background .14s ease,border-color .14s ease}
.tile::before{content:'';position:absolute;left:0;top:17px;bottom:17px;width:3px;
 border-radius:0 3px 3px 0;background:#e5a17c}
.tile:hover{background:#3b2f2b;border-color:#e5a17c}
.tile .bt{white-space:nowrap;font-size:16px;line-height:20px;font-weight:400;
 overflow:hidden;text-overflow:ellipsis}
.tile .bm{display:flex;align-items:center;justify-content:space-between;gap:4px;color:#d2b6a6}
.tile .gen{font-size:9px;letter-spacing:.6px;text-transform:uppercase}
.tile .cnt{font-size:10px;white-space:nowrap;color:#c8bdb5}

.dhead{font-size:22px;font-weight:500;margin:14px 0 4px}
.dcount{margin:0 0 14px;font-size:12px;color:var(--muted)}
.rlist{list-style:none;padding:0;margin:0 0 60px}
.rrow{display:flex;gap:12px;padding:15px 0;border-top:1px solid var(--line);
 align-items:flex-start;width:100%}
.rnum{font-size:11px;color:var(--accent);min-width:22px;padding-top:3px;
 font-variant-numeric:tabular-nums}
.rname{margin:0;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.rmeta{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.5}
.empty{margin:25px 0 6px;color:var(--muted);font-size:14px}

.phead{padding:16px 0 2px}
.phead h1{margin:0;font-size:21px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.phead p{margin:5px 0 0;font-size:12px;color:var(--muted)}
.player{position:sticky;top:var(--navh);z-index:30;background:var(--field);
 border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin:14px 0 8px}
.player::before{content:'';position:absolute;left:-19px;right:-19px;top:-16px;
 height:17px;background:var(--bg)}
.prow{display:flex;align-items:center;gap:13px}
.play{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:var(--accent);
 display:grid;place-items:center}
.play svg{width:20px;height:20px;fill:var(--field);margin-left:2px}
.play.playing svg{margin-left:0}
.ptime{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;
 flex:0 0 auto;min-width:96px;text-align:right}
.bar{flex:1;height:32px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track{width:100%;height:5px;border-radius:3px;background:var(--line);position:relative}
.fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;width:0}
.knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;
 transform:translate(-50%,-50%);left:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.skips{display:flex;gap:9px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.skips button{font-size:13px;color:var(--accent);padding:6px 14px;border-radius:999px;
 background:var(--bg);font-weight:500}
.body{padding:8px 0 60vh}
.sent{display:flex;width:100%;border-radius:9px;transition:background .15s ease;
 padding:6px 10px;align-items:flex-start;line-height:1.6;font-size:17px;text-align:left}
.sent.on{background:var(--accq)}
.sent.on span{font-weight:500}
.sent.done{color:var(--muted)}
.note{color:var(--muted);font-size:13px;padding:10px 0}

.subseg{display:flex;gap:3px;background:var(--field);border:1px solid var(--line);
 border-radius:10px;padding:3px;margin:12px 0 2px}
.subseg button{flex:1;padding:9px 0;border-radius:7px;font-size:14px;font-weight:500;
 color:var(--muted);text-align:center}
.subseg button.on{background:var(--accq);color:var(--accent);font-weight:600}

.sec{padding:20px 0 6px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec.lv3{padding-left:15px;border-top-style:dashed}
.secmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ts{font-size:13px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;
 background:var(--accq);padding:5px 11px;border-radius:7px}
.sec.on .ts{background:var(--accent);color:var(--field)}
.sechead{display:block;width:100%;text-align:left;padding:0 0 8px}
.sechead h2{margin:0;font-size:21px;font-weight:600;line-height:1.3;letter-spacing:-.3px;
 overflow-wrap:anywhere}
.sec.lv3 .sechead h2{font-size:18px;font-weight:500}
.secbody ul{list-style:none;margin:0;padding:0}
.secbody li{position:relative;padding:5px 0 5px 18px;font-size:16.5px;line-height:1.5;
 overflow-wrap:anywhere}
.secbody li:before{content:'';position:absolute;left:3px;top:14px;width:5px;height:5px;
 border-radius:50%;background:var(--muted)}
.secbody li.d1{padding-left:36px;font-size:15.5px;color:var(--muted)}
.secbody li.d1:before{left:21px;width:4px;height:4px;top:13px}
.secbody b{font-weight:600;color:var(--text)}
.secbody i{font-style:italic;color:var(--muted)}
.nextup{margin:26px 0 0;padding:14px 16px;border-radius:10px;background:var(--field);
 border:1px solid var(--line);font-size:14px;color:var(--muted);line-height:1.5}
.nextup span{color:var(--accent);font-weight:500}
`;
const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);

const $ = s => document.querySelector(s), app = $('#app');
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt = s => {s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(s%60).padStart(2,'0')};
const REC = SERMONS.r, BOOKS = SERMONS.books;
const byId = {}; REC.forEach(r => byId[r.i] = r);

const GOSPELS = ['Matthew','Mark'];
const HISTORY = ['Joshua','Judges','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles',
  '2 Chronicles','1 Ezra','Nehemiah','1 Maccabees','2 Maccabees'];
const WISDOM  = ['Job','Proverbs','Ecclesiastes','Wisdom','Sirach'];
const genre = b => GOSPELS.includes(b) ? 'Gospel' : HISTORY.includes(b) ? 'History'
  : WISDOM.includes(b) ? 'Wisdom' : b === 'Psalms' ? 'Poetry' : 'Prophecy';

const norm = t => t.toLowerCase().split('⧸').join('/').replace(/\s+/g,' ').trim();
const hit = (r, q) => !q || norm(r.t + ' ' + r.l + ' ' + r.b.join(' ')).includes(q);
let query = '';

const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>';
const MOON='<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/>';
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);
  $('#ttsvg').innerHTML = t==='dark'?SUN:MOON;
  $('#tcolor').setAttribute('content', t==='dark'?'#191719':'#f6f0e9');}
let theme = LS.get('srm_theme','dark'); applyTheme(theme);
$('#tt').onclick = () => {theme = theme==='dark'?'light':'dark'; LS.set('srm_theme',theme); applyTheme(theme);};

function setNav(backTo, label, title, sub){
  const b = $('#back');
  b.hidden = !backTo;
  $('#brand').hidden = !!backTo;
  $('#mark').style.display = backTo ? 'none' : 'grid';
  if (backTo){ $('#backlab').textContent = label; b.onclick = () => location.hash = backTo; }
  else { $('#brand').querySelector('b').textContent = title; $('#sub').textContent = sub || ''; }
}

const CSS2 = `
.rtxt{flex:1;min-width:0}
.rname{display:block;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.rlist li:first-child .rrow{border-top:0}
.rrow:hover .rname{color:var(--accent)}
.pin{color:var(--accent)}
.resume{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
 font-size:12px;color:var(--muted);padding:6px 2px 0}
.resume button{color:var(--accent);font-size:12px;font-weight:500}
.sent:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.spd{min-width:44px;text-align:center}
.skips .brk{flex-basis:100%;height:0;margin:0;padding:0}
.skips .flw{background:var(--accq);box-shadow:inset 0 0 0 1px var(--accent)}
.skips .flw.off{background:var(--bg);box-shadow:none;opacity:.55}
.jump{position:fixed;left:50%;transform:translateX(-50%);z-index:50;
 bottom:calc(20px + env(safe-area-inset-bottom,0px));
 background:var(--accent);color:var(--field);font-size:13px;font-weight:500;
 padding:11px 18px;border-radius:999px;display:flex;align-items:center;gap:7px;
 box-shadow:0 6px 22px rgba(0,0,0,.45)}
.jump[hidden]{display:none}
.jump svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;
 stroke-linecap:round;stroke-linejoin:round}
`;
const st2 = document.createElement('style'); st2.textContent = CSS2; document.head.appendChild(st2);

const esc = s => String(s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isNT = b => GOSPELS.includes(b);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const encPath = p => p.split('/').map(encodeURIComponent).join('/');

function setNavH(){
  document.documentElement.style.setProperty('--navh',
    document.querySelector('.top').offsetHeight + 'px');
}
setNavH(); addEventListener('resize', setNavH);

/* ---------- search ---------- */
const ICO_SEARCH = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>';
let rawQuery = '';
const searchBox = ph => '<label class="search">' + ICO_SEARCH +
  '<input type="search" id="q" autocomplete="off" spellcheck="false" placeholder="' +
  esc(ph) + '" aria-label="' + esc(ph) + '" value="' + esc(rawQuery) + '"></label>';
function wireSearch(fill){
  const el = $('#q'); if (!el) return;
  el.addEventListener('input', () => { rawQuery = el.value; query = norm(el.value); fill(); });
}

/* ---------- listening positions ---------- */
const POS = LS.get('srm_pos', {});
const savePos = () => LS.set('srm_pos', POS);

/* ---------- library ---------- */
function booksView(){
  stopAudio();
  setNav(null, null, 'Sermons',
    plural(REC.length, 'recording') + ' · ' + plural(BOOKS.length, 'book'));
  app.innerHTML = searchBox('Search books or sermon titles') + '<div id="lib"></div>';
  wireSearch(fillLib); fillLib();
}
function fillLib(){
  let out = '', shown = 0;
  [['Old Testament', false], ['New Testament', true]].forEach(pair => {
    const label = pair[0], nt = pair[1];
    const avail = BOOKS.map(b => ({b: b, items: REC.filter(r => r.b.includes(b) && hit(r, query))}))
                       .filter(x => isNT(x.b) === nt && x.items.length);
    if (!avail.length) return;
    shown += avail.length;
    out += '<section><div class="shelf"><h3>' + label + '</h3><small>' +
      plural(avail.length, 'book') + '</small></div><div class="bgrid">' +
      avail.map(x => '<button class="tile" data-b="' + esc(x.b) + '" aria-label="' +
          esc(x.b) + ', ' + plural(x.items.length, 'recording') + '">' +
          '<span class="bt">' + esc(x.b) + '</span>' +
          '<span class="bm"><span class="gen">' + genre(x.b) + '</span>' +
          '<span class="cnt">' + plural(x.items.length, 'sermon') + '</span></span>' +
        '</button>').join('') + '</div></section>';
  });
  const lib = $('#lib');
  lib.innerHTML = shown ? out : '<p class="empty">No matching recordings.</p>';
  lib.querySelectorAll('.tile').forEach(t => {
    t.onclick = () => { location.hash = 'b/' + encodeURIComponent(t.dataset.b); };
  });
}

/* ---------- one book ---------- */
let curBook = null;
function bookView(book){
  stopAudio();
  if (BOOKS.indexOf(book) < 0){ location.hash = ''; return; }
  curBook = book;
  setNav('#', 'All books');
  app.innerHTML = searchBox('Search in ' + book) +
    '<h2 class="dhead">' + esc(book) + '</h2>' +
    '<p class="dcount" id="dcount"></p><ol class="rlist" id="rlist"></ol>';
  wireSearch(fillBook); fillBook();
}
function fillBook(){
  const book = curBook;
  const items = REC.filter(r => r.b.includes(book) && hit(r, query));
  $('#dcount').textContent = plural(items.length, 'recording') +
    (query ? ' matching your search' : '');
  const list = $('#rlist');
  list.innerHTML = items.length ? items.map((r, i) => {
    const also = r.b.filter(b => b !== book);
    const p = POS[r.i];
    return '<li><button class="rrow" data-i="' + r.i + '">' +
      '<span class="rnum">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="rtxt"><span class="rname">' + esc(r.t) + '</span>' +
      '<span class="rmeta">' + fmt(r.d) +
        (also.length ? ' · Also in ' + esc(also.join(', ')) : '') +
        (p ? ' · <span class="pin">' + Math.min(99, Math.round(p / r.d * 100)) +
             '% in</span>' : '') +
      '</span></span></button></li>';
  }).join('') : '<li class="empty">No matching recordings.</li>';
  list.querySelectorAll('.rrow').forEach(b => {
    b.onclick = () => { location.hash = 'r/' + b.dataset.i; };
  });
}

/* ---------- transcript loader (works over file://) ---------- */
const cache = {};
let pendingSM = null;
window.SM = d => { const p = pendingSM; pendingSM = null; if (p) p(d); };
function load(id){
  if (cache[id]) return Promise.resolve(cache[id]);
  return new Promise((res, rej) => {
    pendingSM = d => { cache[id] = d; res(d); };
    const s = document.createElement('script');
    s.src = 'data/' + id + '.js';
    s.onerror = () => { pendingSM = null; rej(new Error('no data')); };
    document.head.appendChild(s);
  });
}

/* ---------- player ---------- */
let audio = null, rows = [], nodes = [], active = -1, curRec = null,
    dragging = false, lastSaved = 0, dur = 0, session = 0;
let follow = LS.get('srm_follow', true), adrift = false, firstJump = true, userAt = 0;
let tab = 'transcript', curData = null;
let speed = LS.get('srm_speed', 1);

function recordPos(){
  if (!audio || !curRec) return;
  const t = audio.currentTime, d = audio.duration || curRec.d;
  if (!isFinite(t) || !isFinite(d)) return;
  if (t > 20 && d && t < d - 25) POS[curRec.i] = Math.round(t);
  else delete POS[curRec.i];
  lastSaved = t; savePos();
}
function stopAudio(){
  session++;
  if (audio){ recordPos(); audio.pause(); audio.removeAttribute('src'); audio.load(); }
  audio = null; rows = []; nodes = []; active = -1; curRec = null; curData = null; dur = 0;
}

function recording(id, at){
  stopAudio();
  const r = byId[id];
  if (!r){ location.hash = ''; return; }
  const home = (curBook && r.b.indexOf(curBook) >= 0) ? curBook : r.b[0];
  setNav('#b/' + encodeURIComponent(home), home);
  app.innerHTML = '<div class="phead"><h1>' + esc(r.t) +
    '</h1><p id="psub">Loading transcript…</p></div><div id="pslot"></div>';
  load(id).then(d => build(r, d, at))
          .catch(() => { $('#psub').textContent = 'Transcript file for this recording is missing.'; });
}

const ICO_PLAY  = '<path d="M8 5v14l11-7z"/>';
const ICO_PAUSE = '<path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/>';

function build(r, d, at){
  curRec = r; curData = d; rows = d.s; dur = d.d || r.d;
  const resuming = (at == null && POS[r.i] > 0) ? POS[r.i] : 0;
  $('#psub').textContent = fmt(dur) + ' · ' + plural(d.s.length, 'line') +
    (d.o ? ' · ' + plural(d.o.filter(s => s.lv === 2).length, 'section') : '');

  $('#pslot').innerHTML =
    '<div class="player">' +
      '<div class="prow">' +
        '<button class="play" id="pp" aria-label="Play">' +
          '<svg viewBox="0 0 24 24" id="ppi">' + ICO_PLAY + '</svg></button>' +
        '<div class="bar" id="bar" role="slider" aria-label="Seek">' +
          '<div class="track"><div class="fill" id="fill"></div>' +
          '<div class="knob" id="knob"></div></div></div>' +
        '<div class="ptime"><span id="ptxt">0:00</span> / ' + fmt(dur) + '</div>' +
      '</div>' +
      '<div class="skips">' +
        '<button data-s="-30">−30s</button><button data-s="-10">−10s</button>' +
        '<button data-s="10">+10s</button><button data-s="30">+30s</button>' +
        '<span class="brk"></span>' +
        '<button id="spd" class="spd">1×</button>' +
        '<button id="flw" class="flw">Following</button>' +
      '</div>' +
    '</div>' +
    (resuming ? '<div class="resume"><span>Resuming at ' + fmt(resuming) +
       '</span><button id="restart">Start over</button></div>' : '') +
    (d.o ? '<div class="subseg" id="subseg">' +
       '<button data-tb="outline">Outline</button>' +
       '<button data-tb="transcript">Transcript</button></div>' : '') +
    '<div class="body" id="body"></div>' +
    '<button class="jump" id="jump" hidden><svg viewBox="0 0 24 24">' +
      '<path d="M12 5v14M6 13l6 6 6-6"/></svg>Jump to current ' +
      '<span id="jumpwhat">line</span></button>';

  const ss = $('#subseg');
  if (ss) ss.onclick = e => {
    const b = e.target.closest('[data-tb]');
    if (b && b.dataset.tb !== tab) setTab(b.dataset.tb, true);
  };
  setTab(d.o ? 'outline' : 'transcript', false);

  const el = new Audio();
  const my = ++session;
  const live = () => session === my;
  audio = el;
  el.preload = 'metadata';
  el.playbackRate = speed;
  el.src = encPath(d.a);
  const start = at != null ? at : resuming;
  if (start > 0){
    el.addEventListener('loadedmetadata', () => {
      if (!live()) return;
      try { el.currentTime = start; } catch(e){}
      paint(); tick();
    }, {once: true});
  }
  el.addEventListener('timeupdate', () => {
    if (!live()) return;
    if (!dragging) paint();
    tick();
    if (Math.abs(el.currentTime - lastSaved) > 15) recordPos();
  });
  el.addEventListener('play',  () => { if (live()) setPP(true); });
  el.addEventListener('pause', () => { if (live()){ setPP(false); recordPos(); } });
  el.addEventListener('ended', () => {
    if (!live()) return;
    setPP(false); delete POS[curRec.i]; savePos();
  });
  el.addEventListener('error', () => {
    if (!live()) return;
    const s = $('#psub');
    if (s) s.textContent = 'Audio not found — expected ' + d.a;
  });

  $('#pp').onclick = () => { audio.paused ? audio.play() : audio.pause(); };
  const rst = $('#restart');
  if (rst) rst.onclick = () => { seek(0); document.querySelector('.resume').remove(); };

  const bar = $('#bar');
  const at_ = e => {
    const rc = bar.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - rc.left) / rc.width)) * (audio.duration || dur);
  };
  bar.addEventListener('pointerdown', e => {
    dragging = true; bar.setPointerCapture(e.pointerId); seek(at_(e));
  });
  bar.addEventListener('pointermove', e => { if (dragging) seek(at_(e)); });
  bar.addEventListener('pointerup',     () => { dragging = false; recordPos(); });
  bar.addEventListener('pointercancel', () => { dragging = false; });

  document.querySelectorAll('.skips [data-s]').forEach(b => {
    b.onclick = () => seek(audio.currentTime + (+b.dataset.s));
  });
  const sp = $('#spd');
  const SPEEDS = [1, 1.25, 1.5, 1.75, 2];
  const showSpeed = () => { sp.textContent = String(speed).replace('.00', '') + '×'; };
  sp.onclick = () => {
    speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
    audio.playbackRate = speed; LS.set('srm_speed', speed); showSpeed();
  };
  showSpeed();

  adrift = false; firstJump = true;
  $('#flw').onclick = () => setFollow(!follow);
  setFollow(follow);
  $('#jump').onclick = () => { adrift = false; showJump(false); scrollToActive(true); };

  if ('mediaSession' in navigator){
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: r.t, artist: 'Fr Stephen De Young', album: r.b.join(' / ')});
      navigator.mediaSession.setActionHandler('seekbackward', () => seek(audio.currentTime - 15));
      navigator.mediaSession.setActionHandler('seekforward',  () => seek(audio.currentTime + 30));
    } catch(e){}
  }
  paint(); tick();
}

function setTab(name, jump){
  const d = curData, body = $('#body');
  if (!d || !body) return;
  tab = (name === 'outline' && d.o) ? 'outline' : 'transcript';
  const ss = $('#subseg');
  if (ss) ss.querySelectorAll('[data-tb]').forEach(
    b => b.classList.toggle('on', b.dataset.tb === tab));
  const jw = $('#jumpwhat');
  if (jw) jw.textContent = tab === 'outline' ? 'section' : 'line';

  if (tab === 'outline'){
    rows = d.o.map(s => [s.t]);
    body.innerHTML = d.o.map((s, i) =>
      '<div class="sec lv' + s.lv + '" data-i="' + i + '">' +
        '<div class="secmeta"><button class="ts" data-i="' + i + '">' +
          fmt(s.t) + '</button></div>' +
        '<button class="sechead" data-i="' + i + '"><h2>' + s.h + '</h2></button>' +
        '<div class="secbody">' + s.b + '</div>' +
      '</div>').join('') +
      (d.next ? '<div class="nextup"><span>Next</span> \u2014 ' + d.next + '</div>' : '');
  } else {
    rows = d.s;
    body.innerHTML = d.s.map((s, i) =>
      '<button class="sent" data-i="' + i + '"><span>' + esc(s[1]) + '</span></button>').join('');
  }
  nodes = Array.prototype.slice.call(body.querySelectorAll(
    tab === 'outline' ? '.sec' : '.sent'));
  body.onclick = e => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    seek(rows[+b.dataset.i][0]);
    if (audio && audio.paused) audio.play();
  };
  active = -1; adrift = false; firstJump = !jump; showJump(false);
  tick();
  if (jump) scrollToActive(false);
}

function setPP(playing){
  const pp = $('#pp'); if (!pp) return;
  pp.classList.toggle('playing', playing);
  pp.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  $('#ppi').innerHTML = playing ? ICO_PAUSE : ICO_PLAY;
}
function seek(t){
  if (!audio) return;
  audio.currentTime = Math.min(Math.max(0, t), (audio.duration || dur) - 0.2);
  paint(); tick();
}
function paint(){
  if (!audio) return;
  const t = audio.currentTime, d = audio.duration || dur || 1;
  const pc = Math.min(100, t / d * 100);
  const f = $('#fill'), k = $('#knob'), x = $('#ptxt');
  if (f) f.style.width = pc + '%';
  if (k) k.style.left = pc + '%';
  if (x) x.textContent = fmt(t);
}
function tick(){
  if (!audio || !rows.length) return;
  const t = audio.currentTime;
  let i = active;
  if (i < 0 || rows[i][0] > t) i = 0;
  while (i + 1 < rows.length && rows[i + 1][0] <= t) i++;
  if (i === active) return;
  if (active >= 0) nodes[active].classList.remove('on');
  if (tab === 'transcript'){
    if (i > active) for (let k = Math.max(0, active); k < i; k++) nodes[k].classList.add('done');
    else for (let k = i; k <= active; k++) nodes[k].classList.remove('done');
  }
  active = i;
  nodes[i].classList.add('on');
  keepVisible();
}

/* keep the line that is playing on screen */
function bandTop(){
  const t = document.querySelector('.top'), pl = document.querySelector('.player');
  return (t ? t.offsetHeight : 0) + (pl ? pl.offsetHeight : 0) + 14;
}
function inBand(){
  const n = nodes[active]; if (!n) return false;
  const rc = n.getBoundingClientRect(), head = bandTop();
  if (rc.top < head - 2) return false;
  // an outline section is taller than the screen; it only needs its header showing
  return rc.height > innerHeight - head - 120 ? rc.top <= innerHeight - 170
                                              : rc.bottom <= innerHeight - 88;
}
function scrollToActive(smooth){
  const n = nodes[active]; if (!n) return;
  const head = bandTop();
  const y = Math.max(0, scrollY + n.getBoundingClientRect().top -
                        (head + (innerHeight - head) * 0.22));
  // a long jump (a seek, or resuming mid-recording) lands instantly; a line-to-line
  // advance glides, so reading is not interrupted by a several-second animation
  const far = Math.abs(y - scrollY) > innerHeight * 1.6;
  scrollTo({top: y, behavior: (smooth && !far) ? 'smooth' : 'auto'});
}
function showJump(on){ const j = $('#jump'); if (j) j.hidden = !on; }
function keepVisible(){
  if (active < 0 || !nodes[active] || !follow) return;
  if (adrift){ if (inBand()){ adrift = false; showJump(false); } else showJump(true); return; }
  if (!inBand()){ scrollToActive(!firstJump); }
  firstJump = false;
}
function setFollow(on){
  follow = on; adrift = false; LS.set('srm_follow', on);
  const f = $('#flw');
  if (f){ f.classList.toggle('off', !on); f.textContent = on ? 'Following' : 'Follow';
          f.setAttribute('aria-pressed', String(on)); }
  showJump(false);
  if (on) scrollToActive(true);
}
const userScrolled = () => { userAt = Date.now(); };
addEventListener('wheel', userScrolled, {passive: true});
addEventListener('touchmove', userScrolled, {passive: true});
addEventListener('scroll', () => {
  if (!follow || active < 0 || !nodes[active]) return;
  if (Date.now() - userAt > 1200) return;
  if (!inBand()){ if (!adrift){ adrift = true; showJump(true); } }
  else if (adrift){ adrift = false; showJump(false); }
}, {passive: true});

addEventListener('keydown', e => {
  if (!audio || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.code === 'Space'){ e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
  else if (e.key === 'ArrowLeft')  seek(audio.currentTime - 10);
  else if (e.key === 'ArrowRight') seek(audio.currentTime + 10);
});
addEventListener('pagehide', recordPos);
document.addEventListener('visibilitychange', () => { if (document.hidden) recordPos(); });

/* ---------- routing ---------- */
function route(){
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(s => s !== '');
  scrollTo(0, 0);
  if (p[0] === 'b') bookView(decodeURIComponent(p[1] || ''));
  else if (p[0] === 'r') recording(+p[1], p[2] != null ? +p[2] : null);
  else booksView();
}
addEventListener('hashchange', route);
route();
</script>
</body></html>
